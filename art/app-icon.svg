<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#4c3fa8"/><stop offset="0.5" stop-color="#2b2270"/><stop offset="1" stop-color="#151040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cardface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe4f5"/>
    </linearGradient>
    <filter id="winshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#05030f" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <g fill="#ffffff">
      <circle cx="205" cy="360" r="4.5" opacity=".45"/><circle cx="330" cy="150" r="3.5" opacity=".4"/>
      <circle cx="472" cy="130" r="4" opacity=".5"/><circle cx="860" cy="150" r="5" opacity=".5"/>
      <circle cx="795" cy="620" r="3.5" opacity=".35"/><circle cx="150" cy="560" r="4" opacity=".4"/>
      <circle cx="250" cy="840" r="4" opacity=".35"/><circle cx="880" cy="820" r="4.5" opacity=".45"/>
      <circle cx="140" cy="180" r="3.5" opacity=".4"/><circle cx="912" cy="450" r="4" opacity=".4"/>
    </g>
    <!-- strip of Spaces, cropped at both edges; active Space ringed -->
    <rect x="40" y="180" width="156" height="102" rx="16" fill="#ffffff" opacity="0.32"/>
    <rect x="224" y="180" width="156" height="102" rx="16" fill="#ffffff" opacity="0.32"/>
    <rect x="592" y="180" width="156" height="102" rx="16" fill="#ffffff" opacity="0.32"/>
    <rect x="776" y="180" width="156" height="102" rx="16" fill="#ffffff" opacity="0.32"/>
    <rect x="408" y="172" width="156" height="118" rx="16" fill="url(#cardface)" stroke="url(#accent)" stroke-width="10"/>
    <!-- terminal behind -->
    <g filter="url(#winshadow)">
      <rect x="160" y="386" width="420" height="300" rx="20" fill="#1c2333" stroke="#94a3b8" stroke-opacity="0.45" stroke-width="3.5"/>
    </g>
    <circle cx="198" cy="422" r="8.5" fill="#64748b"/><circle cx="226" cy="422" r="8.5" fill="#64748b"/><circle cx="254" cy="422" r="8.5" fill="#64748b"/>
    <rect x="192" y="456" width="130" height="15" rx="7.5" fill="#4ade80" opacity="0.85"/>
    <rect x="192" y="488" width="210" height="15" rx="7.5" fill="#475569"/>
    <rect x="192" y="520" width="164" height="15" rx="7.5" fill="#475569"/>
    <!-- browser stacked in front -->
    <g filter="url(#winshadow)">
      <rect x="320" y="470" width="560" height="340" rx="24" fill="#ffffff" stroke="#c3cde2" stroke-width="4.5"/>
    </g>
    <path d="M 322 540 h 556" stroke="#dde5f2" stroke-width="4.5"/>
    <circle cx="364" cy="505" r="10.5" fill="#b6c2d9"/><circle cx="398" cy="505" r="10.5" fill="#b6c2d9"/><circle cx="432" cy="505" r="10.5" fill="#b6c2d9"/>
    <rect x="360" y="576" width="290" height="26" rx="13" fill="#dde5f2"/>
    <rect x="360" y="630" width="380" height="26" rx="13" fill="#e8edf7"/>
    <rect x="360" y="684" width="330" height="26" rx="13" fill="#e8edf7"/>
  </g>
</svg>
